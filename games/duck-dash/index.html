<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../_game.css"><style>#arena{height:350px;position:relative;overflow:hidden;background:#dcebdc;border-radius:14px}.duck{position:absolute;font-size:44px;cursor:pointer;user-select:none}.puddle{position:absolute;font-size:35px}</style></head><body><main class="game"><h1 class="title">Duck Dash</h1><p class="sub">Click the duck. Avoid the puddles. 30 seconds.</p><div class="panel"><div class="score">Score: <span id="score">0</span> · Time: <span id="time">30</span></div><div id="arena"></div><button id="start">Start game</button><div class="message" id="msg"></div></div></main><script>
const a=document.querySelector("#arena"),s=document.querySelector("#score"),t=document.querySelector("#time"),m=document.querySelector("#msg");let score=0,time=30,run=false,clock;
function move(d){d.style.left=Math.random()*(a.clientWidth-55)+"px";d.style.top=Math.random()*(a.clientHeight-55)+"px"}
function start(){score=0;time=30;run=true;s.textContent=0;t.textContent=30;m.textContent="";a.innerHTML='<div class="duck">🦆</div><div class="puddle">💧</div><div class="puddle">💧</div>';const d=a.querySelector(".duck");move(d);d.onclick=()=>{if(!run)return;score++;s.textContent=score;move(d)};a.querySelectorAll(".puddle").forEach(move);clearInterval(clock);clock=setInterval(()=>{time--;t.textContent=time;if(time<=0){clearInterval(clock);run=false;m.textContent=`Time! You scored ${score}.`}},1000)}
document.querySelector("#start").onclick=start;
</script></body></html>
