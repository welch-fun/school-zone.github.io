<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../_game.css"><style>#canvas{display:block;width:min(640px,100%);margin:auto;background:#2e2118;border-radius:12px;touch-action:none}</style></head><body><main class="game"><h1 class="title">Duck Pong</h1><p class="sub">Move your paddle with your mouse, finger, or arrow keys.</p><div class="panel"><canvas id="canvas" width="640" height="360"></canvas><div class="score">You <span id="ps">0</span> — <span id="cs">0</span> CPU</div><button id="start">Start</button></div></main><script>
const c=document.querySelector("#canvas"),x=c.getContext("2d");let p=145,ball,run=false,ps=0,cs=0,raf;
function reset(){ball={x:320,y:180,vx:4,vy:3}}
function draw(){x.clearRect(0,0,640,360);x.fillStyle="#f6efdf";x.fillRect(20,p,12,70);x.fillRect(608,ball.y-35,12,70);x.font="32px serif";x.fillText("🦆",ball.x-16,ball.y+12);ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<10||ball.y>350)ball.vy*=-1;let cpu=Math.max(0,Math.min(290,ball.y-35));x.fillStyle="#f6efdf";x.fillRect(608,cpu,12,70);if(ball.x<32&&ball.x>15&&ball.y>p&&ball.y<p+70)ball.vx=Math.abs(ball.vx)+.2;if(ball.x>596&&ball.y>cpu&&ball.y<cpu+70)ball.vx=-Math.abs(ball.vx)-.2;if(ball.x<0){cs++;document.querySelector("#cs").textContent=cs;reset()}if(ball.x>640){ps++;document.querySelector("#ps").textContent=ps;reset()}if(run)raf=requestAnimationFrame(draw)}
function start(){run=!run;if(run){reset();draw()}else cancelAnimationFrame(raf);document.querySelector("#start").textContent=run?"Pause":"Start"}
function pos(y){p=Math.max(0,Math.min(290,y-c.getBoundingClientRect().top));p=p/c.getBoundingClientRect().height*360}
c.onpointermove=e=>pos(e.clientY);document.onkeydown=e=>{if(e.key==="ArrowUp")p=Math.max(0,p-18);if(e.key==="ArrowDown")p=Math.min(290,p+18)};document.querySelector("#start").onclick=start;
</script></body></html>
