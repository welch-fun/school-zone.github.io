<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../_game.css"><style>#duck{font-size:100px;border:0;background:transparent;transition:transform .05s}#duck:active{transform:scale(.85)}</style></head><body><main class="game"><h1 class="title">Click Duck</h1><p class="sub">Click as many times as you can in 10 seconds.</p><div class="panel"><div class="big" id="score">0</div><div>seconds: <span id="time">10</span></div><button id="duck">🦆</button><br><button onclick="start()">Start</button><div class="message" id="msg"></div></div></main><script>
let score=0,time=10,run=false,clock;const d=document.querySelector("#duck");d.onclick=()=>{if(run){score++;document.querySelector("#score").textContent=score}};function start(){score=0;time=10;run=true;document.querySelector("#score").textContent=0;document.querySelector("#time").textContent=10;document.querySelector("#msg").textContent="";clearInterval(clock);clock=setInterval(()=>{time--;document.querySelector("#time").textContent=time;if(!time){clearInterval(clock);run=false;document.querySelector("#msg").textContent=`Quack! ${score} clicks.`}},1000)}
</script></body></html>
