<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../_game.css"><style>#pad{height:260px;border-radius:14px;background:#69452d;color:#fff;display:grid;place-items:center;font:700 28px "Space Grotesk";user-select:none;cursor:pointer}#pad.ready{background:#d7e5d8;color:#2e2118}</style></head><body><main class="game"><h1 class="title">Reaction</h1><p class="sub">Wait for green, then click as fast as you can.</p><div class="panel"><div id="pad">Click to begin</div><div class="big" id="result">—</div><div class="message" id="msg"></div></div></main><script>
const p=document.querySelector("#pad"),r=document.querySelector("#result"),m=document.querySelector("#msg");let start=0,timer=null,waiting=false;
p.onclick=()=>{if(waiting){clearTimeout(timer);waiting=false;p.classList.add("ready");p.textContent="TOO EARLY";m.textContent="Click to try again.";return}if(p.classList.contains("ready")){const ms=performance.now()-start;r.textContent=Math.round(ms)+" ms";p.classList.remove("ready");p.textContent="Click to try again";m.textContent=ms<250?"Very quick!":ms<400?"Nice reaction.":"Try again and beat it.";return}p.textContent="Wait...";waiting=true;p.classList.remove("ready");timer=setTimeout(()=>{waiting=false;p.classList.add("ready");p.textContent="CLICK!";start=performance.now()},800+Math.random()*2600)}
</script></body></html>
