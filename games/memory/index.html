<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../_game.css"><style>#board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:440px;margin:18px auto}.card{aspect-ratio:1;border:0;border-radius:12px;background:#69452d;color:transparent;font-size:30px;padding:0}.card.flipped{background:#e8dcc9;color:#2e2118}.card.matched{background:#d7e5d8;color:#2e2118}</style></head><body><main class="game"><h1 class="title">Memory</h1><p class="sub">Find all the matching pairs.</p><div class="panel"><div class="score">Moves: <span id="moves">0</span></div><div id="board"></div><button onclick="newGame()">New game</button><div class="message" id="msg"></div></div></main><script>
const symbols=["🦆","🐸","🚀","🍕","⭐","🐙","🎈","🍩"];let first=null,lock=false,moves=0;
function newGame(){first=null;lock=false;moves=0;document.querySelector("#moves").textContent=0;document.querySelector("#msg").textContent="";const a=[...symbols,...symbols].sort(()=>Math.random()-.5),b=document.querySelector("#board");b.innerHTML="";a.forEach(x=>{const c=document.createElement("button");c.className="card";c.textContent=x;c.onclick=()=>flip(c);b.appendChild(c)})}
function flip(c){if(lock||c.classList.contains("flipped")||c.classList.contains("matched"))return;c.classList.add("flipped");if(!first){first=c;return}moves++;document.querySelector("#moves").textContent=moves;if(first.textContent===c.textContent){first.classList.add("matched");c.classList.add("matched");first=null;if(document.querySelectorAll(".matched").length===16)document.querySelector("#msg").textContent=`Finished in ${moves} moves!`}else{lock=true;setTimeout(()=>{first.classList.remove("flipped");c.classList.remove("flipped");first=null;lock=false},650)}}
newGame();
</script></body></html>
