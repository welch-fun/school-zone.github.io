<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../_game.css"></head><body><main class="game"><h1 class="title">Math Rush</h1><p class="sub">Answer as many as possible in 30 seconds.</p><div class="panel"><div class="score">Score: <span id="score">0</span> · Time: <span id="time">30</span></div><div class="big" id="q">Press Start</div><input id="ans" class="big-input" type="number" style="max-width:260px;text-align:center"><br><button id="start" style="margin-top:12px">Start</button><div class="message" id="msg"></div></div></main><script>
let score=0,time=30,run=false,answer,clock;const q=document.querySelector("#q"),a=document.querySelector("#ans");
function next(){let x=Math.floor(Math.random()*12)+2,y=Math.floor(Math.random()*12)+2,ops=["+","−","×"],op=ops[Math.floor(Math.random()*3)];answer=op==="+"?x+y:op==="−"?x-y:x*y;q.textContent=`${x} ${op} ${y}`;a.value="";a.focus()}
a.onkeydown=e=>{if(e.key==="Enter"&&run){if(Number(a.value)===answer){score++;document.querySelector("#score").textContent=score}next()}};
document.querySelector("#start").onclick=()=>{score=0;time=30;run=true;document.querySelector("#score").textContent=0;document.querySelector("#time").textContent=30;document.querySelector("#msg").textContent="";next();clearInterval(clock);clock=setInterval(()=>{time--;document.querySelector("#time").textContent=time;if(!time){clearInterval(clock);run=false;q.textContent="Finished!";document.querySelector("#msg").textContent=`You got ${score} correct.`}},1000)};
</script></body></html>
